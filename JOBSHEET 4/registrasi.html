<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Registrasi Anggota Baru</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="buku/list.html">Daftar Buku</a></li>
                <li><a href="login.html">Login Petugas</a></li>
                <li><a href="registrasi.html">Daftar Anggota Baru</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Registrasi Anggota Baru</h2>
            <!--
                Form ini untuk aktor Tamu yang ingin menjadi Anggota,
                BELUM diproses (belum ada logika penyimpanan sungguhan) —
                sama seperti form Tambah Buku/Anggota di Jobsheet 1-3.
            -->
            <form>
                <p>
                    <label for="nama">Nama Lengkap</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="text" id="email" name="email" required>
                </p>
                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" required>
                </p>
                <p>
                    <label for="alamat">Alamat</label><br>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit">Daftar</button>
                </p>
            </form>
            <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Latihan Jobsheet 4</p>
    </footer>
</body>
</html>
