    <link rel="stylesheet" href="assets/css/style.css">

<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

    <main>
        <section>
            <h2>Login Petugas</h2>
            <!--
                Catatan: form ini BELUM diproses (belum ada logika login
                sungguhan), persis seperti form Tambah Buku/Anggota di
                Jobsheet 1-3. Otorisasi & sesi login baru akan
                diimplementasikan dengan JavaScript/PHP mulai Jobsheet 5
                dan seterusnya (lihat docs/wireframe.md).
            -->
            <form>
                <p>
                    <label for="username">Username</label><br>
                    <input type="text" id="username" name="username" required>
                </p>
                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" required>
                </p>
                <p>
                    <button type="submit">Masuk</button>
                </p>
            </form>
            <p>Belum punya akun? <a href="registrasi.html">Daftar di sini</a></p>
        </section>
    </main>
