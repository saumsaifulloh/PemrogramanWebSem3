<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Petugas - SIMPUS-Mini</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main style="max-width: 400px; margin: 80px auto; padding: 24px;" class="card">
    <h2 style="text-align: center; margin-bottom: 8px;">SIMPUS-Mini</h2>
    <p style="text-align: center; color: #666; margin-bottom: 24px;">Login Petugas</p>
    
    <form action="#" method="POST">
      <div style="margin-bottom: 16px;">
        <label for="username" style="display: block; margin-bottom: 6px;">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Masukkan username" 
          required 
          style="width: 100%; padding: 10px; box-sizing: border-box;"
        >
      </div>

      <div style="margin-bottom: 20px;">
        <label for="password" style="display: block; margin-bottom: 6px;">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Masukkan password" 
          required 
          style="width: 100%; padding: 10px; box-sizing: border-box;"
        >
      </div>

      <button type="submit" style="width: 100%; padding: 10px; cursor: pointer;">Masuk</button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 14px;">
      Belum punya akun? <a href="#">Daftar di sini</a>
    </p>
  </main>

</body>
</html>
