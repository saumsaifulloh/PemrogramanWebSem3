<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SIMPUS-Mini | Tambah Buku</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

</head>

<body>

    <header>

        <h1>
            <a href="../index.html">
                SIMPUS-Mini
            </a>
        </h1>


        <button
            type="button"
            id="nav-toggle-btn"
            class="nav-toggle-label"
            aria-label="Menu">

            &#9776;

        </button>


        <nav>

            <ul>

                <li>
                    <a href="../index.html">
                        Beranda
                    </a>
                </li>

                <li>
                    <a href="list.html">
                        Daftar Buku
                    </a>
                </li>

                <li>
                    <a href="tambah.html">
                        Tambah Buku
                    </a>
                </li>

                <li>
                    <a href="../anggota/list.html">
                        Daftar Anggota
                    </a>
                </li>

                <li>
                    <a href="../anggota/tambah.html">
                        Tambah Anggota
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <section>

            <h2>
                Tambah Buku
            </h2>


            <form id="form-tambah">


                <!-- JUDUL -->

                <p>

                    <label for="judul">
                        Judul Buku
                    </label>

                    <input
                        type="text"
                        id="judul"
                        name="judul"
                        placeholder="Masukkan judul buku">

                </p>


                <!-- PENGARANG -->

                <p>

                    <label for="pengarang">
                        Pengarang
                    </label>

                    <input
                        type="text"
                        id="pengarang"
                        name="pengarang"
                        placeholder="Masukkan nama pengarang">

                </p>


                <!-- TAHUN TERBIT -->

                <p>

                    <label for="tahun">
                        Tahun Terbit
                    </label>

                    <input
                        type="number"
                        id="tahun"
                        name="tahun"
                        placeholder="Contoh: 2025">

                </p>


                <!-- ISBN -->

                <p>

                    <label for="isbn">
                        ISBN
                    </label>

                    <input
                        type="text"
                        id="isbn"
                        name="isbn"
                        placeholder="Contoh: 978-602-03-3295-6">

                </p>


                <!-- STOK -->

                <p>

                    <label for="stok">
                        Stok
                    </label>

                    <input
                        type="number"
                        id="stok"
                        name="stok"
                        placeholder="Masukkan jumlah stok">

                </p>


                <!-- KATEGORI -->

                <p>

                    <label for="kategori">
                        Kategori
                    </label>

                    <select
                        id="kategori"
                        name="kategori">

                        <option value="">
                            -- Pilih Kategori --
                        </option>

                        <option value="Fiksi">
                            Fiksi
                        </option>

                        <option value="Nonfiksi">
                            Nonfiksi
                        </option>

                        <option value="Pendidikan">
                            Pendidikan
                        </option>

                    </select>

                </p>


                <!-- SIMPAN -->

                <p>

                    <button type="submit">
                        Simpan
                    </button>

                </p>


            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 SIMPUS-Mini — Jobsheet 1
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script
        src="../assets/javascript/app.js">
    </script>

</body>

</html>
