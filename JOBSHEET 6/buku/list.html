<body>

    <header>

        <h1>
            <a href="../index.html">
                SIMPUS-Mini
            </a>
        </h1>


        <div class="search-box">

            <label for="search-input">
                Cari Judul Buku
            </label>

            <input
                type="text"
                id="search-input"
                placeholder="Ketik judul buku...">

        </div>


        <button
            type="button"
            id="nav-toggle-btn"
            class="nav-toggle-label"
            aria-label="Menu">

            &#9776;

        </button>


        <nav>

            <ul>

                <li>
                    <a href="../index.html">
                        Beranda
                    </a>
                </li>

                <li>
                    <a href="list.html">
                        Daftar Buku

                <li>

                <li>

                <li>

                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="table-responsive">

        <section>

            <h2>
                Daftar Buku
            </h2>


            <!-- PENCARIAN -->

            <p>

                <label for="search-input">
                    Cari Judul Buku
                </label>

                <input
                    type="text"
                    id="search-input"
                    placeholder="Ketik judul buku...">

            </p>


            <!-- TOMBOL MUAT ULANG -->

            <button
                type="button"
                id="btn-muat-ulang">

                Muat Ulang

            </button>


            <!-- COUNTER -->

            <p id="counter-info">
                Menampilkan 0 dari 0 data
            </p>


            <!-- LOADING -->

            <div
                id="loading-indicator"
                style="display: none; padding: 10px; font-weight: bold;">

                Memuat data...

            </div>


            <!-- TABEL -->

            <table>

                <thead>

                    <tr>

                        <th>Judul</th>

                        <th>Pengarang</th>

                        <th>Tahun</th>

                        <th>Stok</th>

                        <th>Aksi</th>

                    </tr>

                </thead>


                <tbody>
                </tbody>

            </table>

        </section>

    </main>


    <footer>

        <p>
